<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='150' viewBox='0 0 1200 150' role='img' aria-label='How I work' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><g transform='translate(0,0)'><rect width='386' height='150' rx='16' fill='#0f1729'/><text x='28' y='52' font-size='30'>🔒</text><text x='72' y='50' fill='#ffffff' font-size='20' font-weight='700' font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">Security first</text><text x='28' y='88' fill='#a9b8cf' font-size='15' font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">Parameterized queries, input</text><text x='28' y='110' fill='#a9b8cf' font-size='15' font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">sanitization and RBAC on multi-tenant</text><text x='28' y='132' fill='#a9b8cf' font-size='15' font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">data.</text></g><g transform='translate(407,0)'><rect width='386' height='150' rx='16' fill='#0f1729'/><text x='28' y='52' font-size='30'>🖥️</text><text x='72' y='50' fill='#ffffff' font-size='20' font-weight='700' font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">Servers I run myself</text><text x='28' y='88' fill='#a9b8cf' font-size='15' font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">Ubuntu VPS, DNS, SSL and email</text><text x='28' y='110' fill='#a9b8cf' font-size='15' font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">authentication (SPF, DKIM, DMARC).</text></g><g transform='translate(814,0)'><rect width='386' height='150' rx='16' fill='#0f1729'/><text x='28' y='52' font-size='30'>🧹</text><text x='72' y='50' fill='#ffffff' font-size='20' font-weight='700' font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">Clean workflow</text><text x='28' y='88' fill='#a9b8cf' font-size='15' font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">Conventional Commits and .env.example</text><text x='28' y='110' fill='#a9b8cf' font-size='15' font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">files so projects run locally with no</text><text x='28' y='132' fill='#a9b8cf' font-size='15' font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">guesswork.</text></g></svg>